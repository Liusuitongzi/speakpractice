<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>口语练习 · 英语 & 日语</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(145deg, #0b1a2e 0%, #1d2f4a 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 16px; color: white;
        }
        .app-container {
            background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(12px);
            border-radius: 48px; padding: 24px 20px 28px; max-width: 480px; width: 100%;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 12px; }
        .header h1 { font-size: 1.8rem; font-weight: 600; text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5); }
        .subhead { color: #aac7e0; font-size: 0.9rem; margin-top: 6px; }

        /* 语言切换 */
        .lang-tabs { display: flex; gap: 10px; background: rgba(0, 0, 0, 0.35); border-radius: 100px; padding: 5px; margin-bottom: 20px; }
        .lang-btn { flex: 1; background: transparent; border: none; padding: 10px 0; border-radius: 100px; font-size: 1.1rem; font-weight: 600; color: #9bb5d4; cursor: pointer; transition: 0.25s; }
        .lang-btn.active { background: linear-gradient(135deg, #3f7ab3, #2c5a8c); color: white; box-shadow: 0 8px 18px rgba(0, 30, 60, 0.7); }

        /* 卡片主体 */
        .practice-card {
            background: rgba(12, 25, 45, 0.75); border-radius: 36px; padding: 24px 16px 20px;
            border: 1px solid rgba(255, 255, 255, 0.08); margin-bottom: 16px;
        }
        .sentence-box { text-align: center; padding: 6px 10px 16px; }
        .sentence-display {
            font-size: 1.85rem; font-weight: 600; line-height: 1.35; color: #f0f9ff;
            text-shadow: 0 2px 10px rgba(0, 160, 255, 0.5); margin-bottom: 12px; min-height: 4rem;
            display: flex; align-items: center; justify-content: center;
        }
        .sentence-jp { color: #ffe7b0; text-shadow: 0 2px 12px rgba(255, 180, 40, 0.5); }
        .meaning { font-size: 1rem; color: #b0cbe6; margin-top: 8px; background: rgba(0, 0, 0, 0.25); padding: 8px 16px; border-radius: 100px; display: inline-block; }

        /* 控制区域 */
        .controls { display: flex; justify-content: center; align-items: center; gap: 18px; margin: 20px 0 10px; }
        .record-btn { background: radial-gradient(circle at 30% 20%, #ff5f5f, #b32020); width: 76px; height: 76px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-size: 0.8rem; font-weight: 600; border: none; cursor: pointer; box-shadow: 0 12px 25px rgba(200, 30, 30, 0.6); }
        .record-btn.recording { background: radial-gradient(circle at 30% 20%, #ff9f4b, #cc5500); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 140, 0, 0.5); } 70% { box-shadow: 0 0 0 12px rgba(255, 140, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 140, 0, 0); } }
        .icon-btn { background: radial-gradient(circle at 30% 20%, #3b8fc2, #1a5276); width: 64px; height: 64px; border-radius: 50%; border: none; color: white; font-size: 1.5rem; cursor: pointer; box-shadow: 0 8px 20px rgba(0, 80, 150, 0.6); display: flex; align-items: center; justify-content: center; }
        .icon-btn:disabled { opacity: 0.4; pointer-events: none; }
        .next-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.15); }
        .add-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.15); font-size: 2rem; }

        /* 状态与底部 */
        .status { text-align: center; font-size: 0.85rem; color: #a2bedb; margin-top: 10px; }
        .footer-tip { display: flex; justify-content: space-between; align-items: center; color: #6885a5; font-size: 0.8rem; padding: 0 8px; }

        /* 弹窗表单 */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
        .modal-content { background: #1d2f4a; padding: 24px; border-radius: 24px; width: 100%; max-width: 400px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .modal-content h2 { margin-bottom: 16px; font-size: 1.2rem; text-align: center; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; font-size: 1rem; font-family: inherit; }
        .modal-content textarea { resize: vertical; min-height: 80px; }
        .modal-btns { display: flex; gap: 10px; margin-top: 16px; }
        .modal-btn { flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .btn-save { background: #3f7ab3; color: white; }
        .btn-cancel { background: rgba(255,255,255,0.1); color: #ccc; }
        
        /* 管理列表 */
        .manage-list { max-height: 50vh; overflow-y: auto; margin-bottom: 16px; }
        .manage-item { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .manage-item span { flex: 1; font-size: 0.9rem; margin-right: 10px; word-break: break-all; }
        .delete-btn { background: #b32020; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>🗣️ 口语练习</h1>
            <div class="subhead">支持无限自定义句子</div>
        </div>

        <div class="lang-tabs">
            <button class="lang-btn active" data-lang="en" id="langEnBtn">🇬🇧 English</button>
            <button class="lang-btn" data-lang="jp" id="langJpBtn">🇯🇵 日本語</button>
        </div>

        <div class="practice-card">
            <div class="sentence-box">
                <div id="sentenceDisplay" class="sentence-display">加载中...</div>
                <div id="meaningDisplay" class="meaning">-</div>
            </div>

            <div class="controls">
                <button id="recordBtn" class="record-btn">
                    <span>🎤</span><span id="recordLabel">REC</span>
                </button>
                <button id="playBtn" class="icon-btn" disabled>▶</button>
                <button id="nextBtn" class="icon-btn next-btn">↻</button>
                <button id="manageBtn" class="icon-btn add-btn" title="管理句子">⚙️</button>
            </div>

            <div class="status" id="status">点击麦克风开始录音</div>
        </div>

        <div class="footer-tip">
            <span>🔊 回放你的发音</span>
            <span id="counter">0 / 0</span>
        </div>
    </div>

    <!-- 添加/管理句子的弹窗 -->
    <div id="manageModal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modalTitle">管理句子</h2>
            
            <!-- 列表视图 -->
            <div id="listView">
                <div class="manage-list" id="manageList"></div>
                <button class="modal-btn btn-save" onclick="showAddForm()" style="width: 100%; margin-bottom: 10px;">➕ 添加新句子</button>
                <button class="modal-btn btn-cancel" onclick="closeModal()" style="width: 100%;">关闭</button>
            </div>

            <!-- 添加表单视图 -->
            <div id="formView" style="display: none;">
                <input type="text" id="inputSentence" placeholder="要练习的外语句子">
                <input type="text" id="inputMeaning" placeholder="中文翻译/提示（可不填）">
                <div class="modal-btns">
                    <button class="modal-btn btn-cancel" onclick="showListView()">返回</button>
                    <button class="modal-btn btn-save" onclick="saveSentence()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 默认句子
        const defaultSentences = {
            en: [
                { text: "How are you today?", meaning: "你今天好吗？" },
                { text: "I would like a coffee, please.", meaning: "请给我一杯咖啡。" }
            ],
            jp: [
                { text: "おはようございます。", meaning: "早上好。" },
                { text: "これはいくらですか？", meaning: "这个多少钱？" }
            ]
        };

        // 从本地存储加载数据，如果没有则用默认
        let mySentences = JSON.parse(localStorage.getItem('mySpeakData')) || defaultSentences;
        
        let currentLang = 'en';
        let currentIndex = 0;
        
        // 录音相关变量
        let isRecording = false, mediaRecorder = null, audioChunks = [], recordedBlob = null, audioPlayer = null, recordingStream = null, isPlaying = false;

        // DOM 元素
        const sentenceDisplay = document.getElementById('sentenceDisplay');
        const meaningDisplay = document.getElementById('meaningDisplay');
        const recordBtn = document.getElementById('recordBtn');
        const playBtn = document.getElementById('playBtn');
        const nextBtn = document.getElementById('nextBtn');
        const statusText = document.getElementById('status');
        const counterSpan = document.getElementById('counter');
        const recordLabel = document.getElementById('recordLabel');
        
        // 弹窗元素
        const manageModal = document.getElementById('manageModal');
        const listView = document.getElementById('listView');
        const formView = document.getElementById('formView');
        const manageList = document.getElementById('manageList');
        const inputSentence = document.getElementById('inputSentence');
        const inputMeaning = document.getElementById('inputMeaning');
        const modalTitle = document.getElementById('modalTitle');

        // 保存数据到本地
        function saveData() {
            localStorage.setItem('mySpeakData', JSON.stringify(mySentences));
        }

        // 更新界面
        function updateSentence() {
            const list = mySentences[currentLang];
            
            if (list.length === 0) {
                sentenceDisplay.textContent = "暂无句子，请点击⚙️添加";
                meaningDisplay.textContent = "-";
                counterSpan.textContent = "0 / 0";
                resetRecordingState();
                return;
            }

            if (currentIndex >= list.length) currentIndex = 0;
            
            const item = list[currentIndex];
            sentenceDisplay.textContent = item.text;
            meaningDisplay.textContent = item.meaning || "无翻译";
            counterSpan.textContent = `${currentIndex + 1} / ${list.length}`;
            
            if (currentLang === 'jp') {
                sentenceDisplay.classList.add('sentence-jp');
            } else {
                sentenceDisplay.classList.remove('sentence-jp');
            }
            
            resetRecordingState();
        }

        // --- 录音与播放逻辑 ---
        function resetRecordingState() {
            if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
            if (recordingStream) { recordingStream.getTracks().forEach(track => track.stop()); recordingStream = null; }
            isRecording = false;
            recordBtn.classList.remove('recording');
            recordLabel.textContent = 'REC';
            audioChunks = []; recordedBlob = null;
            if (audioPlayer) { audioPlayer.pause(); audioPlayer = null; }
            isPlaying = false;
            playBtn.innerHTML = '▶';
            playBtn.disabled = true;
            statusText.textContent = '点击麦克风开始录音';
        }

        async function startRecording() {
            if (recordedBlob) recordedBlob = null;
            if (audioPlayer) { audioPlayer.pause(); audioPlayer = null; }
            playBtn.disabled = true;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                recordingStream = stream;
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    if (audioChunks.length > 0) {
                        recordedBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        playBtn.disabled = false;
                        statusText.textContent = '录音完成，点击播放回放';
                    }
                    if (recordingStream) { recordingStream.getTracks().forEach(track => track.stop()); recordingStream = null; }
                    isRecording = false;
                    recordBtn.classList.remove('recording');
                    recordLabel.textContent = 'REC';
                };

                mediaRecorder.start();
                isRecording = true;
                recordBtn.classList.add('recording');
                recordLabel.textContent = 'STOP';
                statusText.textContent = '正在录音... 点击停止';
            } catch (err) {
                statusText.textContent = '无法访问麦克风，请检查权限';
                isRecording = false;
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
            else {
                isRecording = false;
                recordBtn.classList.remove('recording');
                recordLabel.textContent = 'REC';
                if (recordingStream) { recordingStream.getTracks().forEach(track => track.stop()); recordingStream = null; }
            }
        }

        function playRecorded() {
            if (!recordedBlob) return;
            if (isPlaying && audioPlayer) {
                audioPlayer.pause(); audioPlayer.currentTime = 0; isPlaying = false; playBtn.innerHTML = '▶'; return;
            }
            if (audioPlayer) audioPlayer.pause();
            
            const audioUrl = URL.createObjectURL(recordedBlob);
            audioPlayer = new Audio(audioUrl);
            audioPlayer.play().then(() => {
                isPlaying = true; playBtn.innerHTML = '⏸'; statusText.textContent = '正在回放...';
                audioPlayer.onended = () => { isPlaying = false; playBtn.innerHTML = '▶'; statusText.textContent = '回放结束'; URL.revokeObjectURL(audioUrl); audioPlayer = null; };
            }).catch(() => { statusText.textContent = '播放失败'; isPlaying = false; playBtn.innerHTML = '▶'; });
        }

        // --- 弹窗与增删改逻辑 ---
        function openModal() {
            manageModal.style.display = 'flex';
            showListView();
        }

        function closeModal() { manageModal.style.display = 'none'; }

        function showListView() {
            listView.style.display = 'block';
            formView.style.display = 'none';
            modalTitle.textContent = currentLang === 'en' ? '管理英文句子' : '管理日文句子';
            renderManageList();
        }

        function showAddForm() {
            listView.style.display = 'none';
            formView.style.display = 'block';
            inputSentence.value = '';
            inputMeaning.value = '';
            modalTitle.textContent = '添加新句子';
        }

        function renderManageList() {
            manageList.innerHTML = '';
            const list = mySentences[currentLang];
            if (list.length === 0) {
                manageList.innerHTML = '<div style="text-align:center; color:#888; padding:20px 0;">还没有句子，快去添加吧</div>';
                return;
            }
            list.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'manage-item';
                div.innerHTML = `
                    <span>${item.text}</span>
                    <button class="delete-btn" onclick="deleteSentence(${index})">删除</button>
                `;
                manageList.appendChild(div);
            });
        }

        function saveSentence() {
            const text = inputSentence.value.trim();
            const meaning = inputMeaning.value.trim();
            if (!text) { alert('句子不能为空哦！'); return; }
            
            mySentences[currentLang].push({ text, meaning });
            saveData();
            showListView(); // 回到列表
            currentIndex = mySentences[currentLang].length - 1; // 跳转到新加的这句
            updateSentence();
        }

        function deleteSentence(index) {
            if (confirm('确定要删除这个句子吗？')) {
                mySentences[currentLang].splice(index, 1);
                saveData();
                renderManageList();
                if (currentIndex >= mySentences[currentLang].length) currentIndex = Math.max(0, mySentences[currentLang].length - 1);
                updateSentence();
            }
        }

        // --- 事件绑定 ---
        recordBtn.addEventListener('click', () => isRecording ? stopRecording() : startRecording());
        playBtn.addEventListener('click', playRecorded);
        nextBtn.addEventListener('click', () => {
            if (mySentences[currentLang].length === 0) return;
            stopRecording(); resetRecordingState();
            currentIndex = (currentIndex + 1) % mySentences[currentLang].length;
            updateSentence();
        });

        document.getElementById('manageBtn').addEventListener('click', openModal);

        document.getElementById('langEnBtn').addEventListener('click', () => {
            if(currentLang === 'en') return;
            currentLang = 'en'; currentIndex = 0;
            document.getElementById('langEnBtn').classList.add('active');
            document.getElementById('langJpBtn').classList.remove('active');
            updateSentence();
        });

        document.getElementById('langJpBtn').addEventListener('click', () => {
            if(currentLang === 'jp') return;
            currentLang = 'jp'; currentIndex = 0;
            document.getElementById('langJpBtn').classList.add('active');
            document.getElementById('langEnBtn').classList.remove('active');
            updateSentence();
        });

        // 初始化
        updateSentence();
    </script>
</body>
</html>
